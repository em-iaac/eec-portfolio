name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # PII guard (Session 7.5): the term list lives ONLY in the PII_TERMS
      # repo secret (one case-insensitive extended regex per line), never in
      # the repo. On a hit it prints matching file PATHS only, never content.
      - name: PII guard
        env:
          PII_TERMS: ${{ secrets.PII_TERMS }}
        run: |
          if [ -z "$PII_TERMS" ]; then
            echo "PII guard: PII_TERMS secret is unset; failing closed." >&2
            exit 1
          fi
          printf '%s\n' "$PII_TERMS" > "$RUNNER_TEMP/pii-terms.txt"
          if grep -rIliE -f "$RUNNER_TEMP/pii-terms.txt" . --exclude-dir=.git; then
            echo "::error::PII guard: a listed term appears in the files above."
            exit 1
          fi
          echo "PII guard clean."
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      # G5: puppeteer's Chrome (~170MB) lives outside the npm cache; caching
      # it keyed to the lockfile lets its postinstall skip the CDN download
      # on every deploy after the first.
      - name: Cache Puppeteer Chrome
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('site/package-lock.json') }}
      - run: npm ci
        working-directory: site
      # ⚠ No standalone `npm test` step (the guards audit, 2026-08-18): the
      # build script's own first command IS `vitest run` (site/package.json),
      # so a separate step ran the entire suite twice per deploy for identical
      # coverage. A test failure still stops the deploy in the same place —
      # before tsc, vite and the PDF render — with the same attribution.
      # /contact posts to Web3Forms. The access key is public by design (Vite
      # inlines VITE_* into the bundle, so it ships in the deployed JS either
      # way), but it is kept out of the repo, so the deploy reads it from a
      # repo secret exactly the way the PII guard above reads PII_TERMS.
      # This one FAILS OPEN on purpose: with the secret unset the key is empty
      # and the form composes a mailto: instead of posting, which is a working
      # contact page rather than a broken one. If messages stop arriving, check
      # this secret first.
      - run: npm run build
        working-directory: site
        env:
          VITE_WEB3FORMS_KEY: ${{ secrets.WEB3FORMS_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
